name: Contenus du jour

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Programme à lancer"
        default: "matin"
        type: choice
        options:
          - matin
          - midi
          - soir
          - nuit
          - priere_matin
          - lectures
          - commentaire
          - rosaire
          - pensee
          - angelus
          - chemin_de_croix
          - actus
          - priere_soir

jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Choisir le programme
        id: prog
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 5 * * *")  echo "mode=matin" >> "$GITHUB_OUTPUT" ;;
              "0 11 * * *") echo "mode=midi"  >> "$GITHUB_OUTPUT" ;;
              "0 17 * * *") echo "mode=soir"  >> "$GITHUB_OUTPUT" ;;
              *)            echo "mode=nuit"  >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - run: python bot.py ${{ steps.prog.outputs.mode }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
